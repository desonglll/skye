name: Code Review

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  test:
    # if: ${{ contains(github.event.*.labels.*.name, 'gpt review') }} # 如果需要标签触发，取消本行注释
    runs-on: ubuntu-latest
    steps:
      - uses: anc95/ChatGPT-CodeReview@main
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_ENDPOINT: ${{ secrets.OPENAI_API_ENDPOINT }}
          MODEL: ${{ secrets.MODEL }}

          LANGUAGE: Chinese

          PROMPT: |
            你是一个严谨的代码审查专家。请检查以下代码 Diff 中是否存在：
            1. 潜在的 Bug 或逻辑漏洞
            2. 性能瓶颈或多余的计算
            3. 代码可读性和命名规范问题
            请直接指出问题并给出修改建议，文字请用中文。

          top_p: 1
          temperature: 1
          max_tokens: 10000
          MAX_PATCH_LENGTH: 10000
          IGNORE_PATTERNS: "**/node_modules/**,**/*.md,**/dist/**"
          INCLUDE_PATTERNS: "**/*.js,**/*.ts,**/*.py,**/*.rs"
